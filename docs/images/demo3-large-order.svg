<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1240" viewBox="0 0 680 620" font-family="Helvetica, Arial, sans-serif" role="img"><title>Demo 3, a large stock order with its orchestration patterns</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="620" rx="12" fill="#FFFFFF"/>
<rect x="20" y="20" width="640" height="230" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="36" y="45.0" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="start">Pre-trade</text>
<rect x="40" y="52" width="76" height="20" rx="10.0" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/><text x="78.0" y="66.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">parallel</text>
<path d="M40 110 H32 V174 H40" fill="none" stroke="#888780" stroke-width="1.5"/>
<rect x="40" y="84" width="190" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" /><text x="135.0" y="105.5" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle">Reserve buying power</text><text x="135.0" y="123.8" font-size="12"  fill="#185FA5" text-anchor="middle">Core banking API</text>
<rect x="126" y="61" width="104" height="20" rx="10.0" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/><text x="178.0" y="75.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">retry, backoff</text>
<rect x="40" y="148" width="190" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1" /><text x="135.0" y="169.5" font-size="14" font-weight="bold" fill="#27500A" text-anchor="middle">Pre-trade check</text><text x="135.0" y="187.8" font-size="12"  fill="#3B6D11" text-anchor="middle">Flink, reference data</text>
<polygon points="298,142 370,108 442,142 370,176" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
<text x="370" y="147.0" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Limit breach?</text>
<line x1="230" y1="110" x2="302" y2="138" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="230" y1="174" x2="302" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="470" y="116" width="176" height="52" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1" /><text x="558.0" y="137.5" font-size="14" font-weight="bold" fill="#72243E" text-anchor="middle">Risk override</text><text x="558.0" y="155.8" font-size="12"  fill="#993556" text-anchor="middle">Risk officer via case</text>
<rect x="490" y="93" width="136" height="20" rx="10.0" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/><text x="558.0" y="107.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">user task, 15 min</text>
<line x1="442" y1="142" x2="468" y2="142" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<text x="455" y="134.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">yes</text>
<rect x="40" y="216" width="244" height="20" rx="10.0" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/><text x="162.0" y="230.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">compensation, release buying power</text>
<line x1="370" y1="176" x2="370" y2="282" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<text x="380" y="204.3" font-size="12"  fill="#5F5E5A" text-anchor="start">no</text>
<line x1="558" y1="168" x2="558" y2="282" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<text x="568" y="204.3" font-size="12"  fill="#5F5E5A" text-anchor="start">approved</text>
<rect x="20" y="284" width="640" height="96" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="36" y="309.0" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="start">Execution</text>
<rect x="40" y="318" width="190" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" /><text x="135.0" y="339.5" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle">Route and fill</text><text x="135.0" y="357.8" font-size="12"  fill="#185FA5" text-anchor="middle">Exchange</text>
<rect x="120" y="295" width="120" height="20" rx="10.0" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/><text x="180.0" y="309.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">wait until filled</text>
<text x="250" y="338.3" font-size="12"  fill="#5F5E5A" text-anchor="start">An algorithm slices the order over the day</text>
<rect x="250" y="350" width="210" height="20" rx="10.0" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/><text x="355.0" y="364.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">compensation, cancel the order</text>
<line x1="340" y1="380" x2="340" y2="402" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="404" width="640" height="126" rx="16" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/>
<text x="36" y="429.0" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="start">Post-trade</text>
<rect x="40" y="446" width="180" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1" /><text x="130.0" y="467.5" font-size="14" font-weight="bold" fill="#0C447C" text-anchor="middle">Book trade</text><text x="130.0" y="485.8" font-size="12"  fill="#185FA5" text-anchor="middle">Core banking</text>
<rect x="250" y="446" width="180" height="52" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1" /><text x="340.0" y="467.5" font-size="14" font-weight="bold" fill="#72243E" text-anchor="middle">Wait for T+1</text><text x="340.0" y="485.8" font-size="12"  fill="#993556" text-anchor="middle">Settlement, next day</text>
<rect x="290" y="423" width="100" height="20" rx="10.0" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/><text x="340.0" y="437.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">wait for event</text>
<rect x="460" y="446" width="180" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" /><text x="550.0" y="467.5" font-size="14" font-weight="bold" fill="#444441" text-anchor="middle">Publish status</text><text x="550.0" y="485.8" font-size="12"  fill="#5F5E5A" text-anchor="middle">Kafka, orders.status</text>
<line x1="220" y1="472" x2="248" y2="472" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="430" y1="472" x2="458" y2="472" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="504" width="196" height="20" rx="10.0" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/><text x="138.0" y="518.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">escalation case, no rollback</text>
<rect x="215" y="540" width="250" height="22" rx="11.0" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/><text x="340.0" y="555.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">finally, the audit entry always runs</text>
<text x="340" y="584.3" font-size="12"  fill="#5F5E5A" text-anchor="middle">Each team owns its step, the process owns the chain. All systems are mocked in the demo.</text>
<rect x="30" y="598" width="12" height="12" rx="3" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="48" y="608.3" font-size="12"  fill="#5F5E5A" text-anchor="start">Infrastructure</text>
<rect x="140" y="598" width="12" height="12" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="158" y="608.3" font-size="12"  fill="#5F5E5A" text-anchor="start">Applications</text>
<rect x="248" y="598" width="12" height="12" rx="3" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="266" y="608.3" font-size="12"  fill="#5F5E5A" text-anchor="start">Data</text>
<rect x="304" y="598" width="12" height="12" rx="3" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="322" y="608.3" font-size="12"  fill="#5F5E5A" text-anchor="start">Business process</text>
<rect x="438" y="598" width="12" height="12" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="456" y="608.3" font-size="12"  fill="#5F5E5A" text-anchor="start">Cross-domain, Kafka</text>
<rect x="590" y="597" width="30" height="14" rx="7" fill="#FFFFFF" stroke="#888780" stroke-width="1" stroke-dasharray="3 2"/>
<text x="626" y="608.3" font-size="12"  fill="#5F5E5A" text-anchor="start">pattern</text>
</svg>